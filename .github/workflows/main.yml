name: Build Ponedelnik Messenger

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  host-tests:
    name: P2P, signaling, audio codec and engine tests
    runs-on: ubuntu-latest
    env:
      CC: clang
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Run host tests
        run: |
          set -euo pipefail
          javac -version
          java -version
          python3 -m py_compile tools/ponac.py tools/test_pona.py stage_assets.py \
            tools/test_stage_assets.py server/signaling.py tools/test_signaling.py \
            tools/test_messenger_layout.py tools/test_messenger_assets.py \
            tools/test_messenger_native.py tools/test_voice_codec.py
          python3 tools/test_messenger_layout.py
          python3 tools/test_messenger_assets.py
          python3 tools/test_messenger_native.py
          python3 tools/test_signaling.py
          python3 tools/test_voice_codec.py
          python3 tools/test_pona.py
          python3 tools/test_stage_assets.py
          python3 tools/check_source_file_size.py

  android-apk:
    name: Build native Vulkan messenger APK (Android 8+)
    runs-on: ubuntu-latest
    needs: host-tests
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKM" ]; then
            TMP="$(mktemp -d)"
            curl -fsSL -o "$TMP/tools.zip" \
              https://dl.google.com/android/repository/commandlinetools-linux-12266719_latest.zip
            unzip -q "$TMP/tools.zip" -d "$TMP"
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            rm -rf "$ANDROID_HOME/cmdline-tools/latest"
            mv "$TMP/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
            rm -rf "$TMP"
          fi
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;34.0.0"

      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r25c

      - name: Check messenger and compile Java sources
        run: |
          set -euo pipefail
          test -f src/messenger/app.c
          test -f platform/android/java/com/ponedelnik/messenger/P2pAudio.java
          test -f platform/android/java/com/ponedelnik/messenger/P2pCall.java
          python3 tools/check_source_file_size.py
          python3 tools/test_messenger_layout.py
          python3 tools/test_messenger_assets.py
          python3 tools/test_messenger_native.py
          python3 tools/test_signaling.py
          python3 tools/test_voice_codec.py
          JAR="$ANDROID_HOME/platforms/android-35/android.jar"
          mkdir -p staging/classes staging/dex
          mapfile -t JAVA_SOURCES < <(find platform/android/java -type f -name '*.java' | sort)
          javac -source 8 -target 8 -bootclasspath "$JAR" -d staging/classes "${JAVA_SOURCES[@]}"
          mapfile -t CLASS_FILES < <(find staging/classes -type f -name '*.class' | sort)
          "$ANDROID_HOME/build-tools/34.0.0/d8" --min-api 26 --lib "$JAR" \
            --output staging/dex "${CLASS_FILES[@]}"
          cp staging/dex/classes.dex staging/classes.dex

      - name: Stage messenger assets
        run: python3 stage_assets.py assets staging/assets

      - name: Configure and build each Android ABI
        env:
          NDK_ROOT: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail
          TOOLCHAIN="$NDK_ROOT/build/cmake/android.toolchain.cmake"
          report_cmake_failure() {
            local log="$1"
            cat "$log" >&2
            python3 - "$log" <<'PY'
          from pathlib import Path
          import sys
          details = Path(sys.argv[1]).read_text(errors="replace")[-30000:].strip()
          escaped = details.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::error title=Android CMake diagnostics::{escaped}")
          PY
            rm -f "$log"
            exit 1
          }
          run_cmake() {
            local log
            log="$(mktemp)"
            if "$@" >"$log" 2>&1; then
              cat "$log"
              rm -f "$log"
            else
              report_cmake_failure "$log"
            fi
          }
          mkdir -p staging/lib/arm64-v8a staging/lib/armeabi-v7a staging/lib/x86_64
          for ABI in arm64-v8a armeabi-v7a x86_64; do
            BUILD_DIR="build/android-$ABI"
            run_cmake cmake -S . -B "$BUILD_DIR" \
              -DCMAKE_TOOLCHAIN_FILE="$TOOLCHAIN" \
              -DANDROID_ABI="$ABI" \
              -DANDROID_PLATFORM=android-26 \
              -DCMAKE_BUILD_TYPE=Release \
              -DPython3_EXECUTABLE="$(command -v python3)"
            run_cmake cmake --build "$BUILD_DIR" --parallel 2
            install -m 0644 "$BUILD_DIR/libponedelnik_messenger.so" "staging/lib/$ABI/libponedelnik_messenger.so"
          done

      - name: Package, align and sign APK
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/34.0.0"
          JAR="$ANDROID_HOME/platforms/android-35/android.jar"
          "$BT/aapt" package -f \
            -M platform/android/AndroidManifest.xml \
            -S platform/android/res \
            -I "$JAR" \
            -A staging/assets \
            -F unsigned.apk
          (cd staging && zip -q -0 -r ../unsigned.apk classes.dex lib)
          "$BT/zipalign" -v 4 unsigned.apk aligned.apk
          keytool -genkeypair -noprompt -keystore staging/debug.keystore -storetype PKCS12 \
            -storepass android -keypass android -alias androiddebugkey \
            -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
          "$BT/apksigner" sign \
            --ks staging/debug.keystore --ks-type PKCS12 \
            --ks-pass pass:android --ks-key-alias androiddebugkey --key-pass pass:android \
            --out Ponedelnik-Messenger.apk aligned.apk
          "$BT/aapt" dump badging Ponedelnik-Messenger.apk > staging/badging.txt
          head -n 5 staging/badging.txt
          "$BT/apksigner" verify --verbose --print-certs Ponedelnik-Messenger.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Ponedelnik-Messenger-Android
          path: Ponedelnik-Messenger.apk
          if-no-files-found: error
