name: Build Ponedelnik Messenger

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  android:
    name: Build Android Vulkan APK (Android 8-15)
    runs-on: ubuntu-latest
    env:
      CC: clang

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKM" ]; then
            TMP="$(mktemp -d)"
            curl -fsSL -o "$TMP/tools.zip" \
              https://dl.google.com/android/repository/commandlinetools-linux-12266719_latest.zip
            unzip -q "$TMP/tools.zip" -d "$TMP"
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            rm -rf "$ANDROID_HOME/cmdline-tools/latest"
            mv "$TMP/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
            rm -rf "$TMP"
          fi
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;34.0.0"

      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r25c

      - name: Check messenger sources and local tests
        run: |
          set -euo pipefail
          test -f src/messenger/app.c
          test -f platform/android/java/com/ponedelnik/messenger/P2pMessenger.java
          test -f assets/icons/ponedelnik_messenger.png
          clang -std=c99 -Wall -Wextra -Werror -pedantic \
            -Isrc -I. -Itools/host_test/stub -fsyntax-only src/messenger/app.c
          python3 tools/check_source_file_size.py
          python3 tools/test_messenger_layout.py
          python3 tools/test_messenger_assets.py
          python3 tools/test_signaling.py
          python3 -m py_compile server/signaling.py tools/test_signaling.py stage_assets.py

      - name: Stage messenger assets and compile Java bridge
        run: python3 stage_assets.py assets staging/assets

      - name: Build native C and Vulkan libraries
        env:
          NDK_ROOT: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail
          TOOLCHAIN="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin"
          GLUE="$NDK_ROOT/sources/android/native_app_glue"
          C_SOURCES=(src/messenger/app.c src/platform/android/messenger_bridge.c \
            src/engine/runtime.c src/platform/android/android_main.c "$GLUE/android_native_app_glue.c")
          C_OPTS=(-std=c99 -Wall -Wextra -Werror -Wno-missing-field-initializers -Wno-unused-function -pedantic -O3 -s -fPIC -shared \
            -Wl,--no-undefined -Isrc -I. -I"$GLUE" -landroid -llog -ldl -lm -lvulkan)
          mkdir -p staging/lib/arm64-v8a staging/lib/armeabi-v7a staging/lib/x86_64
          for ABI in arm64-v8a armeabi-v7a x86_64; do
            case "$ABI" in
              arm64-v8a) TRIPLE=aarch64-linux-android26;;
              armeabi-v7a) TRIPLE=armv7a-linux-androideabi26;;
              x86_64) TRIPLE=x86_64-linux-android26;;
            esac
            LOG="$(mktemp)"
            if ! "$TOOLCHAIN/$TRIPLE-clang" "${C_OPTS[@]}" "${C_SOURCES[@]}" \
              -o "staging/lib/$ABI/libponedelnik_messenger.so" >"$LOG" 2>&1; then
              cat "$LOG" >&2
              python3 - "$LOG" <<'PY'
          from pathlib import Path
          import sys
          details = Path(sys.argv[1]).read_text(errors="replace").strip()
          escaped = details.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::error title=Native C/Vulkan compiler diagnostics::{escaped}")
          PY
              rm -f "$LOG"
              exit 1
            fi
            rm -f "$LOG"
          done

      - name: Package and align APK
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/34.0.0"
          "$BT/aapt" package -f \
            -M platform/android/AndroidManifest.xml \
            -S platform/android/res \
            -I "$ANDROID_HOME/platforms/android-35/android.jar" \
            -F unsigned.apk ./staging/
          "$BT/zipalign" -v 4 unsigned.apk aligned.apk

      - name: Create an ephemeral debug key, sign and verify APK
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/34.0.0"
          keytool -genkeypair -noprompt -keystore staging/debug.keystore -storetype PKCS12 \
            -storepass android -keypass android -alias androiddebugkey \
            -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
          "$BT/apksigner" sign \
            --ks staging/debug.keystore --ks-type PKCS12 \
            --ks-pass pass:android --ks-key-alias androiddebugkey --key-pass pass:android \
            --out Ponedelnik-Messenger.apk aligned.apk
          "$BT/aapt" dump badging Ponedelnik-Messenger.apk > staging/badging.txt
          head -n 5 staging/badging.txt
          "$BT/apksigner" verify --verbose --print-certs Ponedelnik-Messenger.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Ponedelnik-Messenger-Android
          path: Ponedelnik-Messenger.apk
          if-no-files-found: error
