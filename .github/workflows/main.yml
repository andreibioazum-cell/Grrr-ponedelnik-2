name: Build Geometrium (Pure C + Vulkan)

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build-android:
    name: Build Android APK (Android 8-15)
    runs-on: ubuntu-latest
    env:
      CC: clang

    steps:
      - uses: actions/checkout@v4

      - name: Verify pure-C Geometrium project layout
        run: |
          set -euo pipefail
          test -f src/game/game.c
          test -d src/game/geo
          test -d src/engine
          test -d src/platform/android
          test -d assets/textures
          test -d assets/audio
          test -d platform/android
          grep -q 'package="com.geometrium"' platform/android/AndroidManifest.xml
          grep -q 'android:name="com.geometrium.GameActivity"' platform/android/AndroidManifest.xml
          grep -q 'android:value="geometrium"' platform/android/AndroidManifest.xml
          grep -q 'android:label="Geometrium"' platform/android/AndroidManifest.xml
          grep -q '^package com.geometrium;' platform/android/java/com/geometrium/GameActivity.java
          grep -q 'Java_com_geometrium_GameActivity_nativeReplaceText' src/platform/android/keyboard.inc
          grep -q 'Java_com_geometrium_PresenceJobService_nativePresence' src/platform/android/presence_job.inc

      - name: Check native Geometrium sources, 32x32 textures, 3D occlusion & live multiplayer
        run: |
          clang -std=c99 -Wall -Wextra -Werror -pedantic \
            -Isrc -I. -Itools/host_test/stub -fsyntax-only src/game/game.c
          python3 tools/check_game_file_size.py
          python3 tools/test_resources.py
          python3 tools/test_db_rules.py
          python3 tools/test_string_pool.py
          python3 tools/test_font_memory.py
          python3 tools/test_engine_formats.py
          python3 tools/test_game_state.py

      - name: Check the web console
        run: |
          python3 tools/test_admin_panel.py

      - name: Click through the web console in a real DOM
        run: |
          cd test
          npm ci --no-audit --no-fund
          node test_admin_panel_dom.mjs

      - name: Setup Java for Android build tools
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Check debug signing key
        run: |
          set -euo pipefail
          test -f platform/android/debug.keystore

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install \
            "platforms;android-35" \
            "build-tools;34.0.0" \
            "ndk;25.2.9519653"

      - name: Setup Android NDK
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653" >> "$GITHUB_ENV"

      - name: Stage assets & compile Java bridge
        run: |
          set -euo pipefail
          mkdir -p staging
          python3 stage_assets.py assets staging/assets

      - name: Build native Vulkan 3D libraries (arm64-v8a, armeabi-v7a, x86_64)
        run: |
          set -euo pipefail
          TOOLCHAIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          GLUE="$ANDROID_NDK_HOME/sources/android/native_app_glue"
          C_OPTS=(
            -std=c99 -O2 -fPIC -shared
            -Wall -Wextra -Werror
            -Isrc -I. -I"$GLUE"
            -llog -landroid -lvulkan -lm -ldl
          )
          CPP_OPTS=(
            -std=c++17 -O2 -fPIC
            -Wall -Wextra -Werror
            -fno-exceptions -fno-rtti
            -Isrc -I.
          )
          C_SOURCES=(
            src/game/game.c
            src/engine/runtime.c
            src/platform/android/android_main.c
            "$GLUE/android_native_app_glue.c"
          )
          CPP_SOURCE=src/game/cpp/ui_fx.cpp

          for ABI in arm64-v8a armeabi-v7a x86_64; do
            mkdir -p "staging/lib/$ABI"
            case "$ABI" in
              arm64-v8a) TRIPLE=aarch64-linux-android26;;
              armeabi-v7a) TRIPLE=armv7a-linux-androideabi26;;
              x86_64) TRIPLE=x86_64-linux-android26;;
            esac
            "$TOOLCHAIN/$TRIPLE-clang++" "${CPP_OPTS[@]}" -c "$CPP_SOURCE" -o "staging/ui_fx_$ABI.o"
            "$TOOLCHAIN/$TRIPLE-clang" "${C_OPTS[@]}" "${C_SOURCES[@]}" "staging/ui_fx_$ABI.o" \
              -o "staging/lib/$ABI/libgeometrium.so"
          done

      - name: Package and align Geometrium APK
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/34.0.0"
          "$BT/aapt" package -f \
            -M platform/android/AndroidManifest.xml \
            -S platform/android/res \
            -I "$ANDROID_HOME/platforms/android-35/android.jar" \
            -F unsigned.apk ./staging/
          "$BT/zipalign" -v 4 unsigned.apk aligned.apk

      - name: Sign Geometrium APK
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/34.0.0"
          "$BT/apksigner" sign \
            --ks platform/android/debug.keystore --ks-type PKCS12 \
            --ks-pass pass:android --ks-key-alias androiddebugkey --key-pass pass:android \
            --out Geometrium.apk aligned.apk

      - name: Verify Geometrium APK
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/34.0.0"
          "$BT/aapt" dump badging Geometrium.apk | head -n 5
          "$BT/apksigner" verify --verbose --print-certs Geometrium.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Geometrium-Android-APK
          path: Geometrium.apk
          if-no-files-found: error
